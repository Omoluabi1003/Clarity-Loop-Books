<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <meta name="theme-color" content="#101d35" />
    <title>Clarity Loop — Offline</title>
    <style>
      :root{color-scheme:light}*{box-sizing:border-box}body{min-height:100vh;margin:0;display:grid;place-items:center;padding:24px;background:#fbfaf6;color:#101d35;font-family:Arial,sans-serif;text-align:center}main{max-width:460px}.mark{display:grid;place-items:center;width:88px;height:88px;margin:0 auto;border:2px solid #8a5f17;border-radius:50%;color:#8a5f17;font:700 24px Georgia,serif}h1{margin:20px 0 10px;font:500 38px Georgia,serif}p{margin:0;color:#5d6673;line-height:1.7}button{margin-top:24px;padding:12px 18px;border:0;border-radius:8px;background:#101d35;color:#fff;font-weight:700}
    </style>
  </head>
  <body>
    <main>
      <div class="mark" aria-hidden="true">CL</div>
      <h1>Your studio is offline.</h1>
      <p>Reconnect to continue building your book in Clarity Loop.</p>
      <button type="button" onclick="location.reload()">Try again</button>
    </main>
  </body>
</html>
